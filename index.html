<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arte em Pixels</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #8b5fd3;
  color: #222;
}
body {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
* { box-sizing: border-box; }

button {
  font-family: Arial, Helvetica, sans-serif;
}

/* ---------- TELA DE SELEÇÃO ---------- */
#selectScreen {
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 0;
  background: #8b5fd3;
  overflow: hidden;
}
#selectScreen:before {
  content: "";
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 38px 38px;
  pointer-events: none;
}
#selectorTitle {
  position: relative;
  z-index: 2;
  margin: 3.2vh 80px 1.8vh 80px;
  text-align: center;
  color: #fff;
  font-family: Impact, "Arial Black", Arial, sans-serif;
  font-size: 7.2vh;
  letter-spacing: 4px;
  text-shadow: 0 4px 0 rgba(70,40,125,.35);
}
#artList {
  position: relative;
  z-index: 2;
  width: 94%;
  max-width: 1280px;
  height: 74vh;
  margin: 0 auto;
  text-align: center;
}
.artCard {
  position: relative;
  display: inline-block;
  vertical-align: top;
  width: 17.2%;
  max-width: 214px;
  margin: 1.5vh 1.1%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.artCard canvas {
  display: block;
  width: 100%;
  height: auto;
  border: 2px solid rgba(35,35,35,.55);
  background: #fff;
  image-rendering: pixelated;
}
.artCard:hover canvas {
  outline: 4px solid rgba(255,255,255,.45);
}
.artCard.done {
  cursor: default;
}
.artCard.done canvas {
  filter: brightness(.78);
  -webkit-filter: brightness(.78);
}
.doneBadge {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  width: 76%;
  transform: translate(-50%, -50%);
  background: #39b54a;
  color: #fff;
  border: 4px solid #fff;
  border-radius: 10px;
  padding: 8px 4px;
  font-weight: bold;
  font-size: 14px;
  text-align: center;
  box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.artCard.done .doneBadge { display: block; }

.pageArrow {
  position: absolute;
  z-index: 4;
  top: 4.1vh;
  width: 64px;
  height: 64px;
  border: 4px solid #c8f7ff;
  border-radius: 18px;
  background: #21c6e9;
  color: #fff;
  box-shadow: 0 5px 0 #087eaa, inset 0 4px 0 rgba(255,255,255,.55);
  font-size: 44px;
  line-height: 48px;
  font-weight: bold;
  cursor: pointer;
}
#prevPage { left: 3.2vw; }
#nextPage { right: 3.2vw; }

/* ---------- TELA DO JOGO ---------- */
#gameScreen {
  display: none;
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 0;
  background: #f7b7d5;
  overflow: hidden;
}
#gameScreen:before {
  content: "";
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.28) 2px, transparent 2px),
    linear-gradient(-45deg, rgba(255,255,255,.18) 2px, transparent 2px);
  background-size: 70px 70px;
  opacity: .35;
  pointer-events: none;
}
#gameLayout {
  position: relative;
  z-index: 2;
  display: table;
  table-layout: fixed;
  width: 100%;
  height: 100%;
  padding: 14px 18px;
}
.column {
  display: table-cell;
  vertical-align: middle;
}
#leftColumn {
  width: 18%;
  min-width: 120px;
}
#centerColumn {
  width: 57%;
  text-align: center;
}
#rightColumn {
  width: 25%;
  text-align: center;
}
#palettePanel {
  width: 88%;
  max-width: 230px;
  height: 96%;
  min-height: 420px;
  margin: 0 auto;
  padding: 14px 12px;
  background: #f4e29a;
  border: 7px solid #d9bf52;
  border-radius: 20px;
  box-shadow: inset 0 0 0 3px #f9efb9;
  text-align: center;
}
#menuButton {
  width: 84px;
  height: 72px;
  margin: 0 auto 14px auto;
  padding: 8px;
  border: 4px solid #c8f7ff;
  border-radius: 17px;
  background: #20c5e8;
  box-shadow: 0 5px 0 #0a88ae, inset 0 4px 0 rgba(255,255,255,.55);
  cursor: pointer;
}
.menuGrid {
  width: 44px;
  height: 44px;
  margin: 0 auto;
}
.menuGrid span {
  float: left;
  width: 12px;
  height: 12px;
  margin: 1px;
  background: #fff;
  border-radius: 2px;
}
#palette {
  margin-top: 8px;
}
.colorButton {
  display: block;
  width: 88%;
  height: 64px;
  margin: 10px auto;
  border: 4px solid #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,.25);
  cursor: pointer;
}
.colorButton.selected {
  outline: 5px solid #15a9db;
  outline-offset: 1px;
}
#saveInfo {
  margin: 10px 4px 0 4px;
  padding: 8px 4px;
  font-size: 11px;
  line-height: 15px;
  font-weight: bold;
  color: #826b16;
  border-top: 2px solid rgba(130,107,22,.25);
}

#boardFrame {
  display: inline-block;
  padding: 26px;
  background: #fff;
  border-radius: 26px;
}
#paintTable {
  border-collapse: collapse;
  background: #d8d8d8;
  margin: 0 auto;
}
.paintCell {
  padding: 0;
  border: 2px solid #222;
  background: #d8d8d8;
  text-align: center;
  vertical-align: middle;
  cursor: pointer;
}
.paintCell .hint {
  display: block;
  margin: 0 auto;
}
.paintCell.filled .hint { display: none; }

#brand {
  margin: 0 auto 22px auto;
  line-height: .84;
}
#brandBig {
  color: #f01479;
  font-family: Impact, "Arial Black", Arial, sans-serif;
  font-size: 7vh;
  letter-spacing: 3px;
  text-shadow: 0 3px 0 rgba(170,20,95,.15);
}
#brandSmall {
  color: #55dd62;
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 3.1vh;
  letter-spacing: 1px;
}
#brandLine {
  width: 76%;
  height: 9px;
  border-top: 4px solid #5ad8e8;
  border-bottom: 3px solid #5ad8e8;
  margin: 12px auto 0 auto;
}
#referenceFrame {
  display: inline-block;
  padding: 8px;
  background: #fff;
  border: 2px solid rgba(0,0,0,.25);
}
#referenceCanvas {
  display: block;
  image-rendering: pixelated;
}
#progressText {
  margin-top: 15px;
  color: #8d4270;
  font-weight: bold;
  font-size: 14px;
}

/* ---------- MODAL ---------- */
#completeOverlay {
  display: none;
  position: absolute;
  z-index: 20;
  left: 0; top: 0; right: 0; bottom: 0;
  background: rgba(81,43,112,.58);
  text-align: center;
}
#completeBox {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 420px;
  max-width: 86%;
  transform: translate(-50%, -50%);
  padding: 28px 22px;
  border: 7px solid #fff;
  border-radius: 24px;
  background: #ffe56a;
  box-shadow: 0 9px 0 rgba(0,0,0,.18);
}
#completeBox h2 {
  margin: 0 0 12px 0;
  color: #ef1775;
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 30px;
}
#completeBox p {
  margin: 0 0 20px 0;
  font-size: 17px;
  font-weight: bold;
}
.bigAction {
  min-width: 190px;
  padding: 12px 18px;
  border: 4px solid #fff;
  border-radius: 14px;
  background: #20c5e8;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 4px 0 #0a88ae;
  cursor: pointer;
}

@media (max-width: 900px) {
  #selectorTitle { font-size: 6vh; }
  #leftColumn { width: 16%; }
  #centerColumn { width: 58%; }
  #rightColumn { width: 26%; }
  #palettePanel { width: 96%; padding-left: 7px; padding-right: 7px; }
  .colorButton { height: 48px; margin: 7px auto; }
  #brandBig { font-size: 5.7vh; }
  #brandSmall { font-size: 2.5vh; }
}
</style>
</head>
<body>

<div id="selectScreen">
  <button id="prevPage" class="pageArrow" title="Página anterior">&#8592;</button>
  <button id="nextPage" class="pageArrow" title="Próxima página">&#8594;</button>
  <div id="selectorTitle">ESCOLHA UMA ARTE EM PIXELS</div>
  <div id="artList"></div>
</div>

<div id="gameScreen">
  <div id="gameLayout">
    <div id="leftColumn" class="column">
      <div id="palettePanel">
        <button id="menuButton" title="Voltar para os desenhos">
          <span class="menuGrid">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </span>
        </button>
        <div id="palette"></div>
        <div id="saveInfo">O progresso é salvo automaticamente neste computador.</div>
      </div>
    </div>

    <div id="centerColumn" class="column">
      <div id="boardFrame">
        <table id="paintTable" cellspacing="0" cellpadding="0"></table>
      </div>
    </div>

    <div id="rightColumn" class="column">
      <div id="brand">
        <div id="brandBig">PIXEL</div>
        <div id="brandSmall">COLOR KIDS</div>
        <div id="brandLine"></div>
      </div>
      <div id="referenceFrame">
        <canvas id="referenceCanvas" width="300" height="300"></canvas>
      </div>
      <div id="progressText"></div>
    </div>
  </div>
</div>

<div id="completeOverlay">
  <div id="completeBox">
    <h2>PARABÉNS!</h2>
    <p>Você completou este desenho!</p>
    <button id="chooseAnother" class="bigAction">ESCOLHER OUTRO</button>
  </div>
</div>

<script type="text/javascript">
(function () {
  /* Cores extraídas dos desenhos de referência enviados */
  var COLORS = {
    ".": "#ffffff",
    "Y": "#ebe330",
    "R": "#c51b1a",
    "K": "#2f2e2d",
    "G": "#87bb38",
    "B": "#548fcb",
    "N": "#9b501a",
    "O": "#ee751b",
    "P": "#f667f9",
    "V": "#8b36c8"
  };

  /* 20 desenhos, cada um com grade exata 10x10 */
  var DESIGNS = [
    ["GGG....GGG","GG......GG","GG.Y.Y..GG","GGYKYYKYGG","GGYYOOYYGG","GGGYYYYGGG","GGYYYYYYGG","GGY.Y.Y.GG","GG......GG","GGG....GGG"],
    ["KKKRRRRKKK","KKK.RR.KKK","RRKRRRRKRR","KBKKRRKKBK",".KBRRRRBK.","..KRRRRK..","K.KBRRBK.K","..KBBBBK..","K.KBKKBK.K","..RRKKRR.."],
    ["..........","...K..K...","....KK....","...RRRR...","..RKRRKR..",".RRRRRRRR.",".RRRKRRRR.",".RRRRRKRR.","..RKRRRR..","...RRRR..."],
    ["BBBBBBBBBB","BBBNNNNBBB","BBNNNNNNBB","BNNKNNKNNB","NNNK..KNNN","NNN....NNN","NN..KK..NN","NN..KK..NN","BNB....BNB","BBBBRRBBBB"],
    [".....KK...","..NNNNNN..",".NNBBBBNN.","NNNNNNNNNN",".OOOOOOOO.",".OBBOONNO.",".OBBOONNO.",".OOOOOKNO.","GOOOOONNOG","GGGGGGGGGG"],
    ["....BB....","...BBBB...","..BBBBBB..",".K.K..K.K.",".K..OO..K.",".BBBBBBBB.","KKK....KKK",".KKK..KKK.","..KKKKKK..",".OO....OO."],
    ["...G..G...","....GG....","...GGGG...","..RYRRRR..",".RRRRRYRR.",".RYRRRRRR.",".RRRRRRYR.","..RRYRRR..","...RRRR...","....RR...."],
    ["GGK.....K.","GGGY...Y..","GGGGY.Y...","GGGYYYYY..","GBGYKYKY.B","GBBYYYYYBB","NBBBKKKBBB","NN.BYYYB..","NNBBKKKBB.","NN...K...."],
    ["..........","....GG....","...RRGG...",".G.RRGG.R.",".GGGGGGGG.","...GGGGG..","...GGGG...","..NNNNNN..","...NNNN...","...NNNN..."],
    ["YYYYYYYYYY","Y.Y....Y.Y","YY......YY","YY..YY..YY","YYYYYY..YY","YYYY...YYY","YYYY..YYYY","YYYYYYYYYY","Y.YY..YY.Y","YYYYYYYYYY"],

    [".BB....BB.",".BBBBBBBB.",".BB.BB.BB.",".BB.BB.BB.",".BBBBBBBB.","KKBBBBBBKK","KKKKKKKKKK","..BBYYBB..",".BKKKKKKB.",".BKKBBKKB."],
    ["..........","...NRR....","...NRRRRR.","...NRRRRRR","...NRRRR..","...N......","NNNNNNNNN.",".NNYNYNYN.","..NNNNNNN.","BBBBBBBBBB"],
    ["BBBBBBBBBB","ONBNNNNBNO","NONNNNNNON","NONNNNNNON","BN..NN..NB","BN.KNN.KNB","NNNNNNNNNN","NOOOKKOOON","NOOOOOOOON","BNOO..OONB"],
    ["....GG....","....GG....","..OOOOOO..",".OOOOOOOO.","OOOKOOKOOO","OOOOOOOOOO","OKOOOOOOKO","OOKOOOOKOO",".OOKKKKOO.","..OOOOOO.."],
    ["....VPV...","...VPPPV..","...PPYPP..","...VPPPV..","....VPV...",".....G.GP.","..PG.G.GG.","..GG.GG...","....GG....","GGGGGGGGGG"],
    ["BNBBBBBBNB","BNNNNNNNNB","N...NN...N","N.K.NN.K.N","N...NN...N","NNNOOOONNN","NNNNOONNNN","BNNNNNNNNB","BBNNNNNNBB","BOOOBBOOOB"],
    ["..........","..........","..........","G.RRRKRR.G","G.RKRRRR.G","G.RRRRKR.G",".G......G.","..GGGGGG..","..........",".........."],
    ["GGGNNNN...","GGNOOOON..","GGNKOOKN..","GGGNOON...","GGGGNN..NN","GGONNNN.N.","NN..NNONN.","NN.N.N....","NNNONONN..","NN........"],
    ["..YYYYYY..",".YYYNNYYY.","YYYN..NYYY","KNN.KK.NNK","KNN.KK.NNK","YYYN..NYYY","YYYYNNYYYY","BYYYYYYYYB","YBYYYYYYBY","YYBBBBBBYY"],
    ["..YOOOOY..",".OOYYYYOO.",".OOKYYKOO.",".OOYYYYOO.",".OOYYYYOO.",".OOOOOOOO.","...YYYY..N","..YYYYYY.O","GGYNYYNYOO","GGGGGGGGGG"]
  ];

  var STORAGE_KEY = "pixel_color_kids_marco_v1";
  var currentPage = 0;
  var currentDesign = -1;
  var selectedColor = null;
  var state = loadState();

  var selectScreen = document.getElementById("selectScreen");
  var gameScreen = document.getElementById("gameScreen");
  var artList = document.getElementById("artList");
  var paintTable = document.getElementById("paintTable");
  var palette = document.getElementById("palette");
  var referenceCanvas = document.getElementById("referenceCanvas");
  var progressText = document.getElementById("progressText");
  var completeOverlay = document.getElementById("completeOverlay");

  function loadState() {
    var empty = { completed: {}, progress: {} };
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) { return empty; }
      var parsed = JSON.parse(raw);
      if (!parsed.completed) { parsed.completed = {}; }
      if (!parsed.progress) { parsed.progress = {}; }
      return parsed;
    } catch (e) {
      return empty;
    }
  }

  function saveState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* Se o navegador bloquear armazenamento local, a atividade continua funcionando. */
    }
  }

  function getUniqueColors(design) {
    var used = {};
    var order = [".", "G", "Y", "B", "R", "O", "N", "K", "P", "V"];
    var i, r, c, ch, out = [];
    for (r = 0; r < 10; r++) {
      for (c = 0; c < 10; c++) {
        used[design[r].charAt(c)] = true;
      }
    }
    for (i = 0; i < order.length; i++) {
      ch = order[i];
      if (used[ch]) { out.push(ch); }
    }
    return out;
  }

  function drawPixelCanvas(canvas, design) {
    var ctx = canvas.getContext("2d");
    var size = Math.min(canvas.width, canvas.height);
    var cell = size / 10;
    var r, c, x, y, ch;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (r = 0; r < 10; r++) {
      for (c = 0; c < 10; c++) {
        ch = design[r].charAt(c);
        x = c * cell;
        y = r * cell;
        ctx.fillStyle = COLORS[ch];
        ctx.fillRect(x, y, cell, cell);
        ctx.strokeStyle = "rgba(70,70,70,.58)";
        ctx.lineWidth = 1;
        ctx.strokeRect(Math.round(x) + .5, Math.round(y) + .5, Math.ceil(cell), Math.ceil(cell));
      }
    }
  }

  function renderSelector() {
    var start = currentPage * 10;
    var end = start + 10;
    var i, card, canvas, badge;

    artList.innerHTML = "";

    for (i = start; i < end; i++) {
      card = document.createElement("button");
      card.className = "artCard";
      card.setAttribute("data-index", i);
      card.title = "Desenho " + (i + 1);

      canvas = document.createElement("canvas");
      canvas.width = 200;
      canvas.height = 180;
      card.appendChild(canvas);

      badge = document.createElement("span");
      badge.className = "doneBadge";
      badge.innerHTML = "&#10003; CONCLUÍDO";
      card.appendChild(badge);

      if (state.completed[i]) {
        card.className += " done";
        card.onclick = alreadyDone;
      } else {
        card.onclick = openFromCard;
      }

      artList.appendChild(card);
      drawPixelCanvas(canvas, DESIGNS[i]);
    }

    document.getElementById("prevPage").style.display = currentPage === 0 ? "none" : "block";
    document.getElementById("nextPage").style.display = currentPage === 1 ? "none" : "block";
  }

  function alreadyDone() {
    alert("Este desenho já foi concluído. Escolha outro!");
  }

  function openFromCard() {
    var idx = parseInt(this.getAttribute("data-index"), 10);
    openDesign(idx);
  }

  function openDesign(idx) {
    currentDesign = idx;
    selectedColor = null;
    selectScreen.style.display = "none";
    gameScreen.style.display = "block";
    completeOverlay.style.display = "none";

    renderPalette();
    renderBoard();
    resizeGame();
    drawPixelCanvas(referenceCanvas, DESIGNS[currentDesign]);
    updateProgressText();
  }

  function renderPalette() {
    var colors = getUniqueColors(DESIGNS[currentDesign]);
    var i, btn, code;

    palette.innerHTML = "";
    for (i = 0; i < colors.length; i++) {
      code = colors[i];
      btn = document.createElement("button");
      btn.className = "colorButton";
      btn.setAttribute("data-color", code);
      btn.style.backgroundColor = COLORS[code];
      btn.title = "Escolher esta cor";
      btn.onclick = selectPaletteColor;
      palette.appendChild(btn);
    }

    if (palette.firstChild) {
      palette.firstChild.click();
    }
  }

  function selectPaletteColor() {
    var buttons = palette.getElementsByTagName("button");
    var i;
    selectedColor = this.getAttribute("data-color");

    for (i = 0; i < buttons.length; i++) {
      buttons[i].className = "colorButton";
    }
    this.className = "colorButton selected";
  }

  function getProgressString(idx) {
    var p = state.progress[idx];
    if (!p || p.length !== 100) {
      p = "";
      while (p.length < 100) { p += "0"; }
    }
    return p;
  }

  function setProgressBit(idx, pos) {
    var p = getProgressString(idx);
    p = p.substring(0, pos) + "1" + p.substring(pos + 1);
    state.progress[idx] = p;
  }

  function renderBoard() {
    var design = DESIGNS[currentDesign];
    var progress = getProgressString(currentDesign);
    var r, c, tr, td, hint, pos, ch;

    paintTable.innerHTML = "";

    for (r = 0; r < 10; r++) {
      tr = document.createElement("tr");
      for (c = 0; c < 10; c++) {
        pos = r * 10 + c;
        ch = design[r].charAt(c);

        td = document.createElement("td");
        td.className = "paintCell";
        td.setAttribute("data-pos", pos);
        td.setAttribute("data-color", ch);
        td.ondragstart = function () { return false; };
        td.onclick = paintCell;

        hint = document.createElement("span");
        hint.className = "hint";
        hint.style.backgroundColor = COLORS[ch];
        td.appendChild(hint);

        if (progress.charAt(pos) === "1") {
          td.style.backgroundColor = COLORS[ch];
          td.className = "paintCell filled";
        }

        tr.appendChild(td);
      }
      paintTable.appendChild(tr);
    }
  }

  function paintCell() {
    var required = this.getAttribute("data-color");
    var pos = parseInt(this.getAttribute("data-pos"), 10);

    if (this.className.indexOf("filled") !== -1) {
      return;
    }

    /* Pintura acontece SOMENTE no clique. Não há evento de mousemove. */
    if (selectedColor === required) {
      this.style.backgroundColor = COLORS[required];
      this.className = "paintCell filled";
      setProgressBit(currentDesign, pos);
      saveState();
      updateProgressText();

      if (getProgressString(currentDesign).indexOf("0") === -1) {
        finishDesign();
      }
    } else {
      flashWrong(this);
    }
  }

  function flashWrong(cell) {
    var oldBorder = cell.style.borderColor;
    cell.style.borderColor = "#e52525";
    setTimeout(function () {
      cell.style.borderColor = oldBorder;
    }, 260);
  }

  function updateProgressText() {
    var p = getProgressString(currentDesign);
    var done = 0, i;
    for (i = 0; i < p.length; i++) {
      if (p.charAt(i) === "1") { done++; }
    }
    progressText.innerHTML = done + " de 100 quadrinhos";
  }

  function finishDesign() {
    state.completed[currentDesign] = true;
    saveState();
    completeOverlay.style.display = "block";
  }

  function backToSelector() {
    gameScreen.style.display = "none";
    completeOverlay.style.display = "none";
    selectScreen.style.display = "block";
    renderSelector();
  }

  function resizeGame() {
    var w = window.innerWidth || document.documentElement.clientWidth || 1024;
    var h = window.innerHeight || document.documentElement.clientHeight || 768;
    var reservedW = Math.max(330, Math.floor(w * .39));
    var availableW = w - reservedW - 70;
    var availableH = h - 90;
    var cell = Math.floor(Math.min(availableW / 10, availableH / 10));
    var hintSize;
    var cells, i;
    var refSize = Math.floor(Math.min(h * .42, w * .25, 320));

    if (cell > 64) { cell = 64; }
    if (cell < 28) { cell = 28; }

    hintSize = Math.max(8, Math.floor(cell * .22));

    cells = paintTable.getElementsByTagName("td");
    for (i = 0; i < cells.length; i++) {
      cells[i].style.width = cell + "px";
      cells[i].style.height = cell + "px";
      if (cells[i].firstChild) {
        cells[i].firstChild.style.width = hintSize + "px";
        cells[i].firstChild.style.height = hintSize + "px";
      }
    }

    if (refSize < 180) { refSize = 180; }
    referenceCanvas.width = refSize;
    referenceCanvas.height = refSize;
    if (currentDesign >= 0) {
      drawPixelCanvas(referenceCanvas, DESIGNS[currentDesign]);
    }
  }

  document.getElementById("nextPage").onclick = function () {
    currentPage = 1;
    renderSelector();
  };

  document.getElementById("prevPage").onclick = function () {
    currentPage = 0;
    renderSelector();
  };

  document.getElementById("menuButton").onclick = function () {
    backToSelector();
  };

  document.getElementById("chooseAnother").onclick = function () {
    backToSelector();
  };

  window.onresize = function () {
    if (gameScreen.style.display === "block") {
      resizeGame();
    }
  };

  /* Impede seleção de texto e arraste de elementos, sem criar pintura por arraste. */
  document.onselectstart = function () { return false; };
  document.ondragstart = function () { return false; };

  renderSelector();
})();
</script>
</body>
</html>
